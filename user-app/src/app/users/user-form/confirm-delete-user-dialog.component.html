<div class="dialog-wrap">
  <mat-icon class="warn-icon" aria-hidden="true">delete_forever</mat-icon>
  <h2 class="title">¿Eliminar usuario?</h2>
  <p class="subtitle">Esta acción no se puede deshacer.</p>

  <div class="details" *ngIf="data?.id">
    <mat-icon class="line-icon">fingerprint</mat-icon>
    <span class="value">ID: {{ data.id }}</span>
  </div>

  <div class="actions">
    <button mat-stroked-button (click)="cancelar()">Cancelar</button>
    <button mat-raised-button color="warn" (click)="eliminar()">Eliminar</button>
  </div>
</div>
