<div class="login-container">
  <div class="overlay">
    <div class="auth-wrapper">
      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
        <!-- Usuario -->
        <div class="flex-column"><label for="usuario">Usuario</label></div>
        <div class="input-form">
          <!-- ícono usuario (corregido) -->
          <svg xmlns="http://www.w3.org/2000/svg"
               width="20" height="20" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true">
            <path d="M20 21a8 8 0 0 0-16 0"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>

          <input id="usuario" class="input" type="text"
                 placeholder="Ingresa tu usuario o email"
                 formControlName="usuario" />
        </div>

        <!-- Password -->
        <div class="flex-column"><label for="password">Password</label></div>
        <div class="input-form">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="-64 0 512 512">
            <path d="m336 512h-288c-26.45 0-48-21.52-48-48v-224c0-26.48 21.55-48 48-48h288c26.45 0 48 21.52 48 48v224c0 26.48-21.55 48-48 48zm-288-288c-8.81 0-16 7.17-16 16v224c0 8.83 7.19 16 16 16h288c8.81 0 16-7.17 16-16v-224c0-8.83-7.19-16-16-16z"/>
            <path d="m304 224c-8.83 0-16-7.17-16-16v-80c0-52.93-43.07-96-96-96s-96 43.07-96 96v80c0 8.83-7.17 16-16 16s-16-7.17-16-16v-80c0-70.59 57.41-128 128-128s128 57.41 128 128v80c0 8.83-7.17 16-16 16z"/>
          </svg>
          <input id="password" class="input" type="password" placeholder="Ingresa tu password" formControlName="password" />
        </div>

        <div class="flex-row">
          <label class="remember">
            <input type="checkbox" formControlName="remember" />
            <span>Recordarme</span>
          </label>
          <button type="button" class="link" (click)="goToChangePassword()">¿Olvidaste tu contraseña?</button>
        </div>

        <button class="button-submit" type="submit" [disabled]="loading">
          {{ loading ? 'Ingresando…' : 'Login' }}
        </button>

        <p class="p">¿No tienes cuenta? <button type="button" class="link">Registar Cuenta</button></p>
        <p class="p line"></p>

        <p *ngIf="error" class="error">{{ error }}</p>
      </form>
    </div>
  </div>
</div>
