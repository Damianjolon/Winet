<div class="auth-wrapper">
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <button type="button" class="back" (click)="back()" aria-label="Volver">←</button>

    <div class="hero">
      <div class="lock"><span class="icon"></span></div>
      <h2>Cambiar Contraseña</h2>
      <p class="sub">Ingresa tu contraseña actual y define una nueva.</p>
    </div>

    <div class="flex-column"><label for="usuario">Usuario</label></div>
    <div class="input-form">
      <input id="usuario" class="input" type="text" placeholder="Nombre de Usuario" formControlName="usuario"/>
    </div>

    <div class="flex-column"><label for="old">Contraseña actual</label></div>
    <div class="input-form">
      <input id="old" [type]="hideOld ? 'password' : 'text'" class="input" placeholder="********" formControlName="oldPassword"/>
      <button type="button" class="eye" (click)="hideOld = !hideOld">{{ hideOld ? '👁️' : '🙈' }}</button>
    </div>

    <div class="flex-column"><label for="new">Nueva contraseña</label></div>
    <div class="input-form">
      <input id="new" [type]="hideNew ? 'password' : 'text'" class="input" placeholder="Mínimo 8 caracteres" formControlName="newPassword"/>
      <button type="button" class="eye" (click)="hideNew = !hideNew">{{ hideNew ? '👁️' : '🙈' }}</button>
    </div>

    <div class="flex-column"><label for="confirm">Confirmar contraseña</label></div>
    <div class="input-form">
      <input id="confirm" [type]="hideConfirm ? 'password' : 'text'" class="input" placeholder="Repite la contraseña" formControlName="confirmPassword"/>
      <button type="button" class="eye" (click)="hideConfirm = !hideConfirm">{{ hideConfirm ? '👁️' : '🙈' }}</button>
    </div>

    <div *ngIf="form.errors?.['mismatch']" class="warn">Las contraseñas no coinciden.</div>

    <button class="button-submit" type="submit" [disabled]="loading || redirectIn > 0">
      {{ loading ? 'Guardando…' : 'CONFIRMAR CAMBIOS' }}
    </button>

    <p *ngIf="error" class="error">{{ error }}</p>

    <!-- Mensaje de éxito + cuenta atrás -->
    <p *ngIf="success" class="success">
      {{ success }}
      <br *ngIf="redirectIn > 0">
      <span *ngIf="redirectIn > 0">Serás redirigido al login en {{ redirectIn }} s.</span>

    </p>
  </form>
</div>
