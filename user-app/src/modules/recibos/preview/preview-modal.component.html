<div class="overlay" *ngIf="visible">
  <div class="modal">
    <div class="modal-bar">
      <div class="title">Previsualización de recibo</div>
      <div class="actions">
        <button class="btn-secundario" (click)="close()">Cerrar</button>
        <button class="btn-primario" [disabled]="!safeUrl" (click)="print(frame!.nativeElement)">Imprimir</button>
      </div>
    </div>

    <iframe
      #frame
      class="viewer"
      *ngIf="safeUrl"
      [src]="safeUrl"
      (load)="onIframeLoad($event.target)"
      referrerpolicy="no-referrer"
      sandbox="allow-forms allow-modals allow-popups allow-same-origin allow-scripts">
    </iframe>
  </div>
</div>
